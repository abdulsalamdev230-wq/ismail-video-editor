# ═══════════════════════════════════════════════════════════════
# ISMAIL VISUALS — Google Drive → Portfolio Sync
# Serverless GitHub Action: fetches Muhammad's Google Drive folder
# and auto-commits a sync'd projects.js that the site renders.
# ═══════════════════════════════════════════════════════════════

name: Sync Google Drive → Portfolio

on:
  schedule:
    # Run every hour (UTC)
    - cron: "0 * * * *"
  workflow_dispatch:   # manual trigger
  push:
    branches: [main]

permissions:
  contents: write

env:
  GDRIVE_FOLDER_ID: "1oC0Ih5R1qi8OY0crkls0eAiAGBcBHoJ4"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}

      - name: Generate access token
        id: gauth
        run: |
          # Use the gcloud CLI to generate an access token for the service account
          gcloud auth login --brief --update-adc || true
          echo "auth done"

      - name: Install Google Drive API Python client
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client

      - name: Fetch Drive folder contents
        id: drive
        run: |
          python scripts/list-drive-files.py "${{ env.GDRIVE_FOLDER_ID }}" > projects.json
          echo "FILES=$(cat projects.json | jq -r '.length') videos found" >> $GITHUB_OUTPUT

      - name: Generate projects.js
        id: gen
        run: |
          python scripts/gen-data-js.py projects.json > js/projects.js
          echo "PROJECTS_JS=$(wc -l < js/projects.js) lines written" >> $GITHUB_OUTPUT

      - name: Show sync summary
        run: |
          echo "Sync summary:"
          echo "- Videos found: ${{ steps.drive.outputs.FILES }}"
          echo "- projects.js lines: ${{ steps.gen.outputs.PROJECTS_JS }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/projects.js
          git commit -m "chore(sync): update Google Drive projects [skip ci]" || echo "No changes to commit"
          git push

  # Also auto-deploy to GitHub Pages (keep the existing workflow running)
  deploy:
    needs: sync
    uses: .github/workflows/pages.yml
