# ═══════════════════════════════════════════════════════════════
# ISMAIL VISUALS — Google Drive → Portfolio Auto-Sync
# Every hour the public Drive folder is scanned and js/data.js is
# regenerated, then committed — so a new video uploaded to the
# folder appears on the website automatically.
# Manual trigger: Actions → "Sync Google Drive → Portfolio" → Run
# ═══════════════════════════════════════════════════════════════

name: Sync Google Drive → Portfolio

on:
  schedule:
    # Every hour (UTC)
    - cron: "0 * * * *"
  workflow_dispatch:   # manual trigger
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: drive-sync
  cancel-in-progress: false

env:
  GDRIVE_FOLDER_ID: "1oC0Ih5R1qi8OY0crkls0eAiAGBcBHoJ4"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Scan Drive folder & regenerate data.js
        run: node scripts/sync-drive.mjs

      - name: Commit synced data (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/data.js public/js/data.js scripts/drive-descriptions.json
          if git diff --cached --quiet; then
            echo "No changes since last sync"
          else
            git commit -m "auto(sync): refresh portfolio videos from Google Drive [skip ci]"
            git push
            echo "SYNCED=$(grep -c '    id:' js/data.js)" >> $GITHUB_OUTPUT
          fi
        id: commit

      - name: Summary
        run: |
          echo "### Google Drive → Portfolio sync" >> $GITHUB_STEP_SUMMARY
          echo "- Videos synced: $(grep -c '    id:' js/data.js)" >> $GITHUB_STEP_SUMMARY
          echo "- New uploads appear automatically within an hour." >> $GITHUB_STEP_SUMMARY
          echo "- Customise any title/description: scripts/drive-descriptions.json" >> $GITHUB_STEP_SUMMARY
